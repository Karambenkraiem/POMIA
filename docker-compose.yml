version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pomia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pomia
      POSTGRES_USER: pomia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pomia_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pomia -d pomia"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: pomia_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pomia:${POSTGRES_PASSWORD:-pomia_secret}@postgres:5432/pomia
      JWT_SECRET: ${JWT_SECRET:-pomia_jwt_secret_change_in_production}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGIN: http://localhost:5173
      TZ: Africa/Tunis
      DEMO_LOGIN: ${DEMO_LOGIN:-true}
    ports:
      - "3004:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pomia_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3004/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
